<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#172554">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Control Escolar">

    <title>Control Escolar</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icono.png">
</head>

<body>

    <!-- =========================
         PANTALLA DE INICIO
    ========================== -->

    <section id="pantalla-inicio" class="pantalla activa">

        <div class="inicio-contenedor">

            <div class="inicio-logo">
                <div class="logo-circulo">
                    🎓
                </div>
            </div>

            <h1>CONTROL ESCOLAR</h1>

            <p class="subtitulo">
                Sistema de administración escolar
            </p>

            <button
                class="boton boton-principal boton-inicio"
                onclick="mostrarLogin()">
                INICIAR
            </button>

        </div>

    </section>


    <!-- =========================
         PANTALLA DE LOGIN
    ========================== -->

    <section id="pantalla-login" class="pantalla">

        <div class="login-contenedor">

            <div class="login-icono">
                🔐
            </div>

            <h2>ACCESO AL SISTEMA</h2>

            <p>
                Ingresa tu PIN para continuar
            </p>

            <input
                type="password"
                id="campo-pin"
                class="campo"
                placeholder="PIN"
                maxlength="4"
                inputmode="numeric"
                autocomplete="off">

            <button
                class="boton boton-principal"
                onclick="validarAcceso()">
                ENTRAR
            </button>

            <button
                class="boton boton-secundario"
                onclick="mostrarInicio()">
                VOLVER
            </button>

        </div>

    </section>


    <!-- =========================
         PANTALLA DEL MENÚ
    ========================== -->

    <section id="pantalla-menu" class="pantalla">

        <div class="menu-contenedor">

            <div class="encabezado-menu">

                <div>
                    <h1>CONTROL ESCOLAR</h1>
                    <p>Menú principal</p>
                </div>

                <button
                    class="boton boton-salir"
                    onclick="salirSistema()">
                    SALIR
                </button>

            </div>


            <div class="grid-menu">

                <!-- ALUMNOS -->

                <button
                    class="tarjeta-menu estudiantes"
                    onclick="abrirModulo('alumnos')">

                    <span class="numero">01</span>

                    <span class="icono">🎓</span>

                    <span class="nombre">
                        Alumnos
                    </span>

                </button>


                <!-- PROFESORES -->

                <button
                    class="tarjeta-menu docentes"
                    onclick="abrirModulo('profesores')">

                    <span class="numero">02</span>

                    <span class="icono">👩‍🏫</span>

                    <span class="nombre">
                        Profesores
                    </span>

                </button>


                <!-- GRUPOS -->

                <button
                    class="tarjeta-menu grupos"
                    onclick="abrirModulo('grupos')">

                    <span class="numero">03</span>

                    <span class="icono">👥</span>

                    <span class="nombre">
                        Grupos
                    </span>

                </button>


                <!-- MATERIAS -->

                <button
                    class="tarjeta-menu materias"
                    onclick="abrirModulo('materias')">

                    <span class="numero">04</span>

                    <span class="icono">📚</span>

                    <span class="nombre">
                        Materias
                    </span>

                </button>


                <!-- CALIFICACIONES -->

                <button
                    class="tarjeta-menu calificaciones"
                    onclick="abrirModulo('calificaciones')">

                    <span class="numero">05</span>

                    <span class="icono">📊</span>

                    <span class="nombre">
                        Calificaciones
                    </span>

                </button>


                <!-- ASISTENCIAS -->

                <button
                    class="tarjeta-menu asistencias"
                    onclick="abrirModulo('asistencias')">

                    <span class="numero">06</span>

                    <span class="icono">✅</span>

                    <span class="nombre">
                        Asistencias
                    </span>

                </button>


                <!-- TAREAS -->

                <button
                    class="tarjeta-menu tareas"
                    onclick="abrirModulo('tareas')">

                    <span class="numero">07</span>

                    <span class="icono">📝</span>

                    <span class="nombre">
                        Tareas
                    </span>

                </button>


                <!-- REPORTES -->

                <button
                    class="tarjeta-menu reportes"
                    onclick="abrirModulo('reportes')">

                    <span class="numero">08</span>

                    <span class="icono">📄</span>

                    <span class="nombre">
                        Reportes
                    </span>

                </button>

            </div>

        </div>

    </section>


    <!-- =========================
         PANTALLA DE MÓDULOS
    ========================== -->

    <section
        id="pantalla-modulo"
        class="pantalla">

        <div
            id="contenido-modulo"
            class="modulo-contenedor">
        </div>

    </section>


    <!-- =========================
         MODAL
         IMPORTANTE: INICIA OCULTO
    ========================== -->

    <div
        id="modal"
        class="modal oculto">

        <div class="modal-contenido">

            <button
                class="modal-cerrar"
                onclick="cerrarModal()">
                ×
            </button>

            <h2 id="modal-titulo">
                Control Escolar
            </h2>

            <p id="modal-contenido"></p>

            <button
                class="boton boton-principal"
                onclick="cerrarModal()">
                ACEPTAR
            </button>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="app.js"></script>

</body>
</html>
